name: Publish reconciled Oweleaf release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source snapshot
        run: |
          python3 - <<'PYCODE'
          import zipfile,hashlib
          from pathlib import Path
          archive=Path('1-v042-source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='edf72d4fc476be9f783e02ee720bc76739837642f4cec04e3f4618344cbd1c50'
          with zipfile.ZipFile(archive) as z:
            for item in z.infolist():
              path=Path(item.filename)
              assert path.parts[0]=='oweleaf' and '..' not in path.parts and '.git' not in path.parts
              if item.is_dir():continue
              if str(Path(*path.parts[1:])) in ['EVALUATION_SCORECARD.md','HACKATHON_INTELLIGENCE.md','SHIP_CHECKLIST.md']:continue
              assert item.file_size<10000000
              target=Path(*path.parts[1:]);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(item))
          PYCODE
      - name: Verify isolated tests
        run: node run.mjs --test
      - name: Commit readable source and remove transport archive
        run: |
          git config user.name 'oweleaf-release'
          git config user.email 'oweleaf-release@users.noreply.github.com'
          git rm 1-v042-source.zip
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess,json,hashlib,zipfile
          files=[Path(n) for n in subprocess.check_output(['git','ls-files'],text=True).splitlines() if n!='ARCHIVE_MANIFEST.json' and not n.startswith('.github/') and Path(n).is_file()]
          manifest={str(p):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          Path('ARCHIVE_MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          files.append(Path('ARCHIVE_MANIFEST.json'))
          with zipfile.ZipFile('/tmp/oweleaf-v0.4.2.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in files:z.write(p,'oweleaf/'+str(p))
          Path('/tmp/oweleaf-v0.4.2.sha256').write_text(hashlib.sha256(Path('/tmp/oweleaf-v0.4.2.zip').read_bytes()).hexdigest()+'  oweleaf-v0.4.2.zip\n')
          PYCODE
          git add .
          git commit -m 'Polish decision status, ready counts, guide completion and reset feedback'
          git push
      - name: Publish verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.4.2 /tmp/oweleaf-v0.4.2.zip /tmp/oweleaf-v0.4.2.sha256 --target main --title 'Oweleaf v0.4.2 - focused invoice review' --notes '152 Node tests,29 full-app UI checks and26 static-sample checks. Automated checks, not human-usability evidence. Source snapshot includes no-login fixture demo and browser-only sample. No production-readiness or AI-superiority claim. See README for measured limits and earlier synthetic PayPal sandbox evidence.'
