name: Publish checked source tree
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract approved source snapshot
        run: |
          python3 - <<'PYCODE'
          import zipfile, hashlib
          from pathlib import Path
          archive=Path('3-source-current.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='e44bbc4d81fd2fed72d0debe3cb96beb7def65cca4ac987f39555e7291e1cc2b', 'Unexpected source snapshot'
          with zipfile.ZipFile(archive) as z:
            for item in z.infolist():
              path=Path(item.filename)
              assert path.parts[0]=='oweleaf' and '..' not in path.parts and '.git' not in path.parts
              target=Path(*path.parts[1:])
              if item.is_dir(): continue
              assert item.file_size < 10000000
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(z.read(item))
          PYCODE
      - name: Verify source tests
        run: node run.mjs --test
      - name: Commit readable tree and remove obsolete root bundles
        run: |
          git config user.name 'oweleaf-release'
          git config user.email 'oweleaf-release@users.noreply.github.com'
          git rm --ignore-unmatch 2-LICENSE 3-oweleaf-source.zip 4-6-approval.png 5-SOURCE_MANIFEST.json source-current.zip 2-source-current.zip 3-source-current.zip
          git rm -r --ignore-unmatch .github/workflows/.github
          git add .
          git commit -m 'Publish readable source, no-login demo and browser sample'
          git push
