name: Publish reconciled Oweleaf release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source snapshot
        run: |
          python3 - <<'PYCODE'
          import zipfile,hashlib
          from pathlib import Path
          archive=Path('3-reconciled-source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='c83529984e99d6931c3458569169f227fba1216b7f2d52d2d14f710571f5fe7d'
          with zipfile.ZipFile(archive) as z:
            for item in z.infolist():
              path=Path(item.filename)
              assert path.parts[0]=='oweleaf' and '..' not in path.parts and '.git' not in path.parts
              if item.is_dir():continue
              assert item.file_size<10000000
              target=Path(*path.parts[1:]);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(item))
          PYCODE
      - name: Verify isolated tests
        run: node run.mjs --test
      - name: Commit readable source and remove transport archive
        run: |
          git config user.name 'oweleaf-release'
          git config user.email 'oweleaf-release@users.noreply.github.com'
          cp 3-reconciled-source.zip /tmp/oweleaf-v0.4.1.zip
          echo 'c83529984e99d6931c3458569169f227fba1216b7f2d52d2d14f710571f5fe7d  oweleaf-v0.4.1.zip' > /tmp/oweleaf-v0.4.1.sha256
          git rm 3-reconciled-source.zip
          git add .
          git commit -m 'Reconcile merged source, revisioned sample assets and reliable reset'
          git push
      - name: Publish verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.4.1 /tmp/oweleaf-v0.4.1.zip /tmp/oweleaf-v0.4.1.sha256 --target main --title 'Oweleaf v0.4.1 - focused invoice review' --notes '152 Node tests,27 full-app UI checks and20 static-sample checks. Automated checks, not human-usability evidence. Source snapshot includes no-login fixture demo and browser-only sample. No production-readiness or AI-superiority claim. See README for measured limits and earlier synthetic PayPal sandbox evidence.'
